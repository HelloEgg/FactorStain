milestone: m1_factorial
seed: 42
image_size: 256
batch_size: 8
num_workers: 8
epochs: 75
early_stopping_patience: 10
gradient_accumulation_steps: 2
learning_rate: 0.0002
weight_decay: 0.0001
model_width: 64

holdout_fraction: 0.18
validation_fraction: 0.10
morphology_split: [0.70, 0.15, 0.15]
models: [joint, parallel, factorstain]

# Strong paired losses are applied only to same-stain scanner transfers.
# Cross-stain/factorial targets are serial sections and receive weak structural
# and distributional supervision instead of pixel-perfect reconstruction.
loss_weights:
  scanner_pixel: 1.0
  scanner_ssim: 0.5
  scanner_lpips: 0.5
  scanner_dino: 0.5
  scanner_edge: 0.25
  cross_stain_statistics: 1.0
  cross_stain_dino_morphology: 0.5
  cross_stain_edge: 0.25
  cross_stain_grayscale: 0.25

auxiliary:
  dinov3_model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
  dinov3_dtype: bfloat16
  use_dinov3_training_loss: true
  use_lpips_training_loss: true

episodes_per_group: 64
validation_episodes_per_group: 16
max_eval_per_protocol: 5000
bootstrap_samples: 1000
fast_dev_bootstrap_samples: 50

fast_dev_epochs: 1
fast_dev_batches: 2
fast_dev_groups: 8
fast_dev_eval_per_protocol: 8

decision:
  win_metrics: 4
  relative_improvement: 0.05
  relative_improvement_metrics: 2
  consistent_metrics: 1
  confidence: 0.95
